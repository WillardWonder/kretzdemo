<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kretz Field App</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body { background-color: #0F172A; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; }
        .kretz-gold { color: #E2B13C; }
        .btn-gold { background-color: #E2B13C; color: #0F172A; font-weight: bold; }
        #map { height: 280px; width: 100%; border-radius: 0.75rem; z-index: 1; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col p-4">
    <header class="mb-3 text-center">
        <h1 class="text-xl font-bold kretz-gold uppercase tracking-wider">Kretz Land Co.</h1>
        <p class="text-xs text-slate-400">Live Field Parcel Scout</p>
    </header>

    <main class="max-w-md mx-auto w-full flex flex-col gap-3 pb-6">
        <!-- Interactive Map Container -->
        <div class="w-full border border-slate-700 rounded-xl overflow-hidden shadow-lg bg-slate-800">
            <div id="map"></div>
        </div>
        
        <!-- Address & Coordinate Badge -->
        <div id="addressBadge" class="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-center text-xs text-slate-300">
            📍 Move pin to inspect location...
        </div>

        <!-- Location Buttons -->
        <button id="locateBtn" class="btn-gold w-full py-3 rounded-lg shadow-lg text-sm active:scale-95 transition-transform">
            🎯 Center on My GPS Location
        </button>

        <!-- Manual Override -->
        <div class="w-full flex gap-2">
            <input type="text" id="manualParcel" placeholder="Enter Parcel ID manually" class="flex-grow p-2.5 rounded-lg bg-slate-800 border border-slate-600 text-white text-sm focus:outline-none focus:border-yellow-500">
            <button id="manualBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 px-4 rounded-lg text-sm">Go</button>
        </div>

        <!-- Status & Results -->
        <div id="status" class="text-slate-400 text-xs text-center h-4"></div>
        
        <div id="resultCard" class="hidden w-full bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-2xl">
            <h2 class="text-xs font-bold text-slate-400 mb-2 uppercase border-b border-slate-700 pb-2">Property Intelligence Card</h2>
            <div id="resultContent" class="text-sm whitespace-pre-wrap leading-relaxed"></div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize Map centered on Wausau, Wisconsin default
        const map = L.map('map').setView([44.9591, -89.6301], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.tileLayer.wms('https://services3.arcgis.com/n6uYoouQZW75n5WI/arcgis/services/Wisconsin_Statewide_Parcels_DB/MapServer/wms', {
            layers: '0',
            format: 'image/png',
            transparent: true,
            opacity: 0.7,
            attribution: 'WI Parcels'
        }).addTo(map);

        const marker = L.marker([44.9591, -89.6301], { draggable: true }).addTo(map);

        const statusEl = document.getElementById('status');
        const addressBadge = document.getElementById('addressBadge');
        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');

        setTimeout(() => { 
            map.invalidateSize(); 
            processPinLocation(44.9591, -89.6301);
        }, 200);

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            processPinLocation(e.latlng.lat, e.latlng.lng);
        });

        marker.on('dragend', function(event) {
            const position = marker.getLatLng();
            processPinLocation(position.lat, position.lng);
        });

        document.getElementById('locateBtn').addEventListener('click', () => {
            if (!navigator.geolocation) {
                statusEl.textContent = "Geolocation not supported.";
                return;
            }
            statusEl.textContent = "Acquiring GPS...";
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng], 16);
                marker.setLatLng([lat, lng]);
                processPinLocation(lat, lng);
            }, () => {
                statusEl.textContent = "Unable to retrieve GPS location.";
            }, { enableHighAccuracy: true });
        });

        document.getElementById('manualBtn').addEventListener('click', () => {
            const parcelId = document.getElementById('manualParcel').value.trim();
            if (parcelId) {
                statusEl.textContent = `Analyzing Manual Parcel ${parcelId}...`;
                resultCard.classList.add('hidden');
                runAIValuation(parcelId, "Marathon County", "Private Landowner");
            }
        });

        // STEP 1: Process GPS coordinates -> Reverse Geocode to Address -> Query Parcel
        async function processPinLocation(lat, lng) {
            statusEl.textContent = "Resolving location address...";
            addressBadge.textContent = `Pin: (${lat.toFixed(4)}, ${lng.toFixed(4)}) — Looking up address...`;
            resultCard.classList.add('hidden');

            let resolvedAddress = "Unknown Road / Woodlot Area";
            let resolvedCounty = "Marathon County";

            try {
                // Reverse geocode via Nominatim to get real street/location context
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                const geoData = await geoRes.json();
                
                if (geoData && geoData.address) {
                    const road = geoData.address.road || geoData.address.suburb || geoData.address.neighbourhood || "Rural Route";
                    const city = geoData.address.city || geoData.address.town || geoData.address.county || "Wausau Area";
                    resolvedAddress = `${road}, ${city}`;
                    resolvedCounty = geoData.address.county || "Marathon County";
                }
            } catch (e) {
                console.warn("Reverse geocode warning:", e);
            }

            addressBadge.textContent = `📍 ${resolvedAddress} (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

            // STEP 2: Query Parcel Database using Spatial Envelope Buffer
            statusEl.textContent = "Querying parcel records for this location...";
            const buffer = 0.0003; // robust envelope
            const esriUrl = `https://services3.arcgis.com/n6uYoouQZW75n5WI/arcgis/rest/services/Wisconsin_Statewide_Parcels_DB/FeatureServer/0/query?geometry=${lng - buffer},${lat - buffer},${lng + buffer},${lat + buffer}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=PARCELID,CNTY_NAME,TAXPAYNAME,SITE_ADDR&f=json`;

            try {
                const response = await fetch(esriUrl);
                const data = await response.json();

                if (data.features && data.features.length > 0) {
                    const attr = data.features[0].attributes;
                    const parcelId = attr.PARCELID || "WI-PARCEL-RESOLVED";
                    const county = attr.CNTY_NAME || resolvedCounty;
                    const ownerName = attr.TAXPAYNAME || "Private Landowner";
                    
                    statusEl.textContent = `Parcel identified: ${parcelId}`;
                    runAIValuation(parcelId, county, ownerName);
                } else {
                    // Strict data integrity: report honestly if no tax parcel polygon matches address bounds
                    statusEl.textContent = "No private tax parcel registered at this address.";
                    resultContent.textContent = `NOTICE: Address "${resolvedAddress}" at coordinates (${lat.toFixed(4)}, ${lng.toFixed(4)}) maps to municipal, institutional, or unparcelled right-of-way ground. No active timber assessment record found.`;
                    resultCard.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Parcel Query Error:", error);
                statusEl.textContent = "GIS parcel lookup failed.";
                resultContent.textContent = "ERROR: Could not complete parcel database lookup.";
                resultCard.classList.remove('hidden');
            }
        }

        // STEP 3: Run AI Valuation with Real Retrieved Data
        async function runAIValuation(parcelId, county, ownerName) {
            try {
                statusEl.textContent = `Generating Property Intelligence Card for ${parcelId}...`;
                
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ parcelId, county, ownerName })
                });

                const data = await response.json();
                
                if (data.result) {
                    statusEl.textContent = "Analysis complete.";
                    resultContent.textContent = data.result;
                    resultCard.classList.remove('hidden');
                } else {
                    throw new Error(data.error || "Unknown server error");
                }
            } catch (error) {
                console.error("API Error:", error);
                statusEl.textContent = "Error generating valuation.";
                resultContent.textContent = "Error: " + error.message;
                resultCard.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
