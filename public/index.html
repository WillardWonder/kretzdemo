<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kretz Field App</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #0F172A; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; }
        .kretz-gold { color: #E2B13C; }
        .btn-gold { background-color: #E2B13C; color: #0F172A; font-weight: bold; }
        #map { height: 250px; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="flex flex-col h-screen p-4 overflow-y-auto">
    <header class="mb-4 mt-2 text-center">
        <h1 class="text-xl font-bold kretz-gold uppercase tracking-wider">Kretz Land Co.</h1>
        <p class="text-xs text-slate-400">Interactive Field Scout & Valuation</p>
    </header>

    <main class="flex-grow flex flex-col items-center max-w-md mx-auto w-full pb-6">
        <!-- Interactive Map Container -->
        <div class="w-full mb-4 border border-slate-700 rounded-xl overflow-hidden shadow-lg">
            <div id="map"></div>
        </div>
        <p class="text-xs text-slate-400 mb-4 text-center">📍 Drag the pin anywhere on the map to inspect a parcel.</p>

        <!-- Location Buttons -->
        <button id="locateBtn" class="btn-gold w-full py-3 rounded-lg shadow-lg text-sm mb-4 active:scale-95 transition-transform">
            🎯 Center on My GPS Location
        </button>

        <!-- Manual Override -->
        <div class="w-full flex gap-2 mb-4">
            <input type="text" id="manualParcel" placeholder="Or enter Parcel ID manually" class="flex-grow p-2.5 rounded-lg bg-slate-800 border border-slate-600 text-white text-sm focus:outline-none focus:border-yellow-500">
            <button id="manualBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 px-4 rounded-lg text-sm">Go</button>
        </div>

        <!-- Status & Results -->
        <div id="status" class="text-slate-400 text-xs mb-3 h-5 text-center"></div>
        
        <div id="resultCard" class="hidden w-full bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-2xl">
            <h2 class="text-xs font-bold text-slate-400 mb-2 uppercase border-b border-slate-700 pb-2">Property Intelligence Card</h2>
            <div id="resultContent" class="text-sm whitespace-pre-wrap leading-relaxed"></div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered on Central Wisconsin (Wausau area default)
        const map = L.map('map').setView([45.1054, -89.6300], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Add a Draggable Pin
        const marker = L.marker([45.1054, -89.6300], { draggable: true }).addTo(map);

        const statusEl = document.getElementById('status');
        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');

        // When pin is dragged and dropped, query that lat/long
        marker.on('dragend', function (event) {
            const position = marker.getLatLng();
            queryLocation(position.lat, position.lng);
        });

        // Center on GPS
        document.getElementById('locateBtn').addEventListener('click', () => {
            if (!navigator.geolocation) {
                statusEl.textContent = "Geolocation not supported.";
                return;
            }
            statusEl.textContent = "Acquiring GPS...";
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng], 15);
                marker.setLatLng([lat, lng]);
                queryLocation(lat, lng);
            }, () => {
                statusEl.textContent = "Unable to retrieve your location.";
            });
        });

        document.getElementById('manualBtn').addEventListener('click', () => {
            const parcelId = document.getElementById('manualParcel').value.trim();
            if (parcelId) {
                statusEl.textContent = `Analyzing Parcel ${parcelId}...`;
                resultCard.classList.add('hidden');
                runAIValuation(parcelId, "Manual Search", null);
            }
        });

        async function queryLocation(lat, lng) {
            statusEl.textContent = "Querying state parcel records for dropped pin...";
            resultCard.classList.add('hidden');

            const esriUrl = `https://services3.arcgis.com/n6uYoouQZW75n5WI/arcgis/rest/services/Wisconsin_Statewide_Parcels_DB/FeatureServer/0/query?geometry=${lng},${lat}&geometryType=esriGeometryPoint&spatialRel=esriSpatialRelIntersects&outFields=PARCELID,CNTY_NAME,TAXPAYNAME,SITE_ADDR&f=json`;

            try {
                const response = await fetch(esriUrl);
                const data = await response.json();

                if (data.features && data.features.length > 0) {
                    const attr = data.features[0].attributes;
                    const parcelId = attr.PARCELID;
                    const county = attr.CNTY_NAME || "Northwoods Region";
                    const ownerName = attr.TAXPAYNAME || "Private Landowner";
                    
                    statusEl.textContent = `Parcel identified. Running evaluation...`;
                    runAIValuation(parcelId, county, ownerName);
                } else {
                    // Graceful handling for non-parcel locations (campuses, parks, roads)
                    statusEl.textContent = "Location is outside private parcel boundaries.";
                    resultContent.textContent = "NOTICE: The selected pin is on public, institutional, or unmapped land. Move the map pin onto a private woodland parcel to generate timber intelligence.";
                    resultCard.classList.remove('hidden');
                }
            } catch (error) {
                statusEl.textContent = "GIS lookup failed.";
                resultContent.textContent = "ERROR: Could not connect to Wisconsin State GIS service.";
                resultCard.classList.remove('hidden');
            }
        }

        async function runAIValuation(parcelId, county, ownerName) {
            try {
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ parcelId, county, ownerName })
                });
                
                const data = await response.json();
                statusEl.textContent = "Analysis complete.";
                resultContent.textContent = data.result;
                resultCard.classList.remove('hidden');
            } catch (error) {
                statusEl.textContent = "Error generating valuation.";
            }
        }
    </script>
</body>
</html>
