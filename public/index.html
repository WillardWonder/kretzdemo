<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kretz Field App</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0F172A; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; }
        .kretz-gold { color: #E2B13C; }
        .btn-gold { background-color: #E2B13C; color: #0F172A; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col h-screen p-4">
    <header class="mb-6 mt-4 text-center">
        <h1 class="text-2xl font-bold kretz-gold uppercase tracking-wider">Kretz Land Co.</h1>
        <p class="text-sm text-slate-400">Forester Intelligence Field Tool</p>
    </header>

    <main class="flex-grow flex flex-col items-center">
        <!-- Location Button -->
        <button id="locateBtn" class="btn-gold w-full max-w-md py-4 rounded-lg shadow-lg text-lg mb-6 active:scale-95 transition-transform">
            📍 Run Cross-Reference (Current Location)
        </button>

        <!-- Manual Override -->
        <div class="w-full max-w-md flex gap-2 mb-6">
            <input type="text" id="manualParcel" placeholder="Or enter Parcel ID manually" class="flex-grow p-3 rounded-lg bg-slate-800 border border-slate-600 text-white focus:outline-none focus:border-yellow-500">
            <button id="manualBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-lg">Go</button>
        </div>

        <!-- Status & Results -->
        <div id="status" class="text-slate-400 text-sm mb-4 h-6 text-center"></div>
        
        <div id="resultCard" class="hidden w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-2xl">
            <h2 class="text-xs font-bold text-slate-400 mb-2 uppercase border-b border-slate-700 pb-2">AI Valuation Output</h2>
            <div id="resultContent" class="text-sm whitespace-pre-wrap"></div>
        </div>
    </main>

    <script>
        const locateBtn = document.getElementById('locateBtn');
        const manualBtn = document.getElementById('manualBtn');
        const statusEl = document.getElementById('status');
        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');

        // Step 1: Capture GPS & Query ArcGIS
        locateBtn.addEventListener('click', () => {
            statusEl.textContent = "Acquiring GPS coordinates...";
            resultCard.classList.add('hidden');

            if (!navigator.geolocation) {
                statusEl.textContent = "Geolocation is not supported by your browser.";
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const { latitude, longitude } = position.coords;
                statusEl.textContent = `Found location (${latitude.toFixed(4)}, ${longitude.toFixed(4)}). Querying state records...`;

                const esriUrl = `https://services3.arcgis.com/n6uYoouQZW75n5WI/arcgis/rest/services/Wisconsin_Statewide_Parcels_DB/FeatureServer/0/query?geometry=${longitude},${latitude}&geometryType=esriGeometryPoint&spatialRel=esriSpatialRelIntersects&outFields=PARCELID,CNTY_NAME&f=json`;

                try {
                    const response = await fetch(esriUrl);
                    const data = await response.json();

                    if (data.features && data.features.length > 0) {
                        const parcelId = data.features[0].attributes.PARCELID;
                        const county = data.features[0].attributes.CNTY_NAME;
                        statusEl.textContent = `Parcel ${parcelId} identified in ${county} County. Running AI valuation...`;
                        runAIValuation(parcelId, county);
                    } else {
                        statusEl.textContent = "No parcel boundary found at this location.";
                    }
                } catch (error) {
                    statusEl.textContent = "Error querying Wisconsin State GIS.";
                }
            }, (error) => {
                statusEl.textContent = "GPS Error: Please allow location access.";
            });
        });

        manualBtn.addEventListener('click', () => {
            const parcelId = document.getElementById('manualParcel').value.trim();
            if(parcelId) {
                statusEl.textContent = `Running AI valuation for ${parcelId}...`;
                resultCard.classList.add('hidden');
                runAIValuation(parcelId, "Unknown");
            }
        });

        // Step 2: Send to Secure Backend
        async function runAIValuation(parcelId, county) {
            try {
                // Calls the serverless function running on Vercel
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ parcelId, county })
                });
                
                const data = await response.json();
                statusEl.textContent = "Analysis complete.";
                resultContent.textContent = data.result;
                resultCard.classList.remove('hidden');
            } catch (error) {
                statusEl.textContent = "Error running AI valuation.";
            }
        }
    </script>
</body>
</html>
